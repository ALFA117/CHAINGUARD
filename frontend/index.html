<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>ChainGuard — Solidity vulnerability scanner in your browser</title>
    <meta name="description" content="Paste a Solidity contract and get a security report in under a second: six SWC Registry checks, line-level findings, fix recommendations and a PDF export. Free and open source." />
    <link rel="canonical" href="https://chainguard-pi.vercel.app/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ChainGuard" />
    <meta property="og:title" content="ChainGuard — find the bug before it costs millions" />
    <meta property="og:description" content="Six SWC Registry checks on any Solidity contract, in the browser, in under a second. Line-level findings and a PDF report." />
    <meta property="og:url" content="https://chainguard-pi.vercel.app/" />
    <meta property="og:image" content="https://chainguard-pi.vercel.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="ChainGuard: a shield over a Solidity contract with a reentrancy finding flagged" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ChainGuard — find the bug before it costs millions" />
    <meta name="twitter:description" content="Six SWC Registry checks on any Solidity contract, in the browser, in under a second." />
    <meta name="twitter:image" content="https://chainguard-pi.vercel.app/og.png" />

    <meta name="theme-color" content="#090C10" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F1EFE9" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/svg+xml" href="/shield.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      // Stamp the theme before first paint so light-mode readers never see a dark flash.
      try {
        var t = localStorage.getItem('cg-theme');
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.dataset.theme = t;
      } catch (e) { document.documentElement.dataset.theme = 'dark'; }
    </script>
  </head>
  <body>
    <noscript><p style="padding:24px;font-family:sans-serif">ChainGuard needs JavaScript to run the scanner. The source is at https://github.com/ALFA117/CHAINGUARD</p></noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
